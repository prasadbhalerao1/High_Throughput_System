<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Location Sharing Application</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />
        <style>
            #map {
                height: 90vh;
            }
        </style>
    </head>
    <body>
        <h1>Location Sharing Application</h1>

        <div id="map"></div>
        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
        <script>
            const map = L.map("map");

            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            }).addTo(map);

            function getUserCurrentLocation() {
                return new Promise((resolve, reject) => {
                    if ("geolocation" in navigator) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                const lattitude = position.coords.latitude;
                                const longitude = position.coords.longitude;

                                resolve({ lattitude, longitude });
                            },
                            (error) => {
                                reject(error);
                            },
                            { enableHighAccuracy: true },
                        );
                    } else {
                        reject("Geolocation is not available here!");
                    }
                });
            }

            getUserCurrentLocation().then((position) => {
                map.setView([position.lattitude, position.longitude], 13);
            });
        </script>
    </body>
</html>
